[project]
name = "ccswitch-core"
version = "0.1.0"
description = "Local credential engine for Claude Code Switcher (macOS). Spawned as a short-lived subprocess by the Swift menu bar app; one command per invocation, JSON on stdout."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccswitch_core"]
